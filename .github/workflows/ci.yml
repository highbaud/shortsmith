name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-import:
    name: lint + import smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # v6 was pinned for Node 24, but the v6 tag actually targets Node 20 and
      # CI was warning about it on every run. v7 is the release that moved to
      # Node 24. Nothing between v7 and v10 touches what this workflow uses
      # (`python-version` and `enable-cache`): the other breaking changes are
      # `server-url` removal, a new `manifest-file` format, a `prune-cache`
      # default flip, and caching disabled for sensitive events.
      #
      # Pinned to an exact patch, not `@v10`: setup-uv dropped its moving
      # major-tag workflow in v8.0.0, so `v6` resolved but `v10` does not exist.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      # Discovers every shipped module instead of naming them. The previous
      # hand-written list silently went stale: shortsmith.names, .layouts,
      # .gallery and all of scripts/ were never imported here, so an import
      # error in any of them reached a render run before it reached CI.
      - name: import smoke (every shipped module)
        run: uv run pytest tests/test_import_smoke.py -q

      - name: CLI help
        run: uv run shortsmith --help

      - name: pytest (unit tests)
        # pytest + pytest-mock are already installed by `uv sync --extra dev`;
        # no need to re-add them via --with.
        run: uv run pytest tests/ -v
