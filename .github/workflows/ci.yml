name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-import:
    name: lint + import smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # setup-uv v6 runs on Node 24 (Node 20 actions are deprecated June 2026)
      # and accepts `python-version` directly. It installs uv, then provisions
      # the requested Python via `uv python install` under the hood.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      # Discovers every shipped module instead of naming them. The previous
      # hand-written list silently went stale: shortsmith.names, .layouts,
      # .gallery and all of scripts/ were never imported here, so an import
      # error in any of them reached a render run before it reached CI.
      - name: import smoke (every shipped module)
        run: uv run pytest tests/test_import_smoke.py -q

      - name: CLI help
        run: uv run shortsmith --help

      - name: pytest (unit tests)
        # pytest + pytest-mock are already installed by `uv sync --extra dev`;
        # no need to re-add them via --with.
        run: uv run pytest tests/ -v
