[project]
name = "shortsmith"
version = "0.6.0"
description = "Long-form video in. Batch of viral Hyperframes-ready 9:16 shorts out."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
keywords = ["video", "shorts", "viral", "podcast", "hyperframes", "whisper", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "anthropic>=2.4.0",
    "opencv-contrib-python>=5.0.0",
    "numpy>=2.5.4",
    "jinja2>=3.1.6",
    "auto-editor>=29.3.1",
    "python-slugify>=9.1.3",
    "tqdm>=4.70.1",
    "click>=8.5.0",
    "soundfile>=0.14.0",
    "librosa>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    # Pre-commit framework + detect-secrets backend. Scans staged diffs for
    # token-shaped strings (sk-, ghp_, Bearer, AWS, GCP, Stripe, OAuth, ...)
    # so accidentally pasting a Metricool / Anthropic / GitHub credential
    # into source code or a commit message fails the commit locally before
    # it ever reaches the GitHub push. Install once: `uv run pre-commit install`.
    "pre-commit>=4.7.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
shortsmith = "shortsmith.pipeline:main"

[project.urls]
Homepage = "https://github.com/highbaud/shortsmith"
Repository = "https://github.com/highbaud/shortsmith"
Issues = "https://github.com/highbaud/shortsmith/issues"
Changelog = "https://github.com/highbaud/shortsmith/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortsmith"]

[tool.hatch.build.targets.sdist]
include = [
    "shortsmith",
    "templates",
    "prompts",
    "models",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# hyperframes-student-kit is a vendored third-party submodule (someone else's
# repo, pinned by commit). Linting it fails CI on findings we neither own nor
# can fix here, and a submodule is not covered by ruff's default excludes.
extend-exclude = ["hyperframes-student-kit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line-length is enforced separately; some prompts/strings legitimately exceed

[tool.uv]
# Resemble Enhance and DeepFilterNet are intentionally NOT in the base deps —
# they're optional alternative engines with awkward install paths (Resemble pulls
# from GitHub, DeepFilterNet has compiled extensions). The default ClearerVoice
# engine lives in the sibling audio-enhance/ project with its own pyproject.
# shortcut: faster-whisper 1.2.1 passes `metadata_errors` to av.open(), which PyAV 19
# removed. Drop this cap once faster-whisper ships a release that supports av 19.
constraint-dependencies = ["av<19"]
