[project]
name = "audio-enhance"
version = "0.1.0"
description = "ClearerVoice-Studio wrapper for shortsmith"
requires-python = ">=3.11,<3.12"
dependencies = [
    "clearvoice",
    "soundfile",  # clearvoice pins soundfile==0.12.1
    "numpy<2",
    # Listed directly so the CUDA index below applies; PyPI Windows torch is CPU-only.
    "torch>=2.15.0",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
